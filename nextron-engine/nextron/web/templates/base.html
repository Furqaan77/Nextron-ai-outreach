<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"selfRequestsOnly":true,"historyCacheSize":0,"includeIndicatorStyles":false,"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true,"error":true,"target":"#request-error","swapOverride":"textContent"}]}'>
<title>{% block title %}Nextron{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx-2.0.11.min.js" defer></script>
{%- block scripts %}{% endblock %}
</head>
<body hx-headers='{{ {"X-CSRF-Token": csrf_token}|tojson }}'>
<header class="site-header">
<a class="brand" href="/">Nextron</a>
<nav aria-label="Sections">
{%- if nav %}
<ul>
{%- for section in nav %}
<li><a href="{{ section.href }}">{{ section.label }}</a></li>
{%- endfor %}
</ul>
{%- endif %}
</nav>
</header>
<section id="notifications" aria-live="polite"><p id="request-error" class="request-error" role="alert"></p><div id="notification-list" hx-get="/notifications" hx-trigger="load"></div></section>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
